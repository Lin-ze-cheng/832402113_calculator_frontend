<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于前后端分离架构的在线计算器" />
    <title>前后端分离计算器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator-panel" aria-labelledby="app-title">
        <header class="panel-header">
          <div>
            <p class="eyebrow">CALCULATOR SYSTEM</p>
            <h1 id="app-title">前后端分离计算器</h1>
            <p class="student-info">832402113 · 林泽成</p>
          </div>
          <div id="api-status" class="api-status" aria-live="polite">
            <span class="status-dot"></span>
            <span>正在连接后端</span>
          </div>
        </header>

        <div class="display-card">
          <label for="expression">数学表达式</label>
          <input
            id="expression"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            maxlength="200"
            placeholder="例如：(1 + 2) × 3"
            aria-describedby="input-hint"
          />
          <p id="input-hint" class="input-hint">支持键盘输入，按 Enter 计算，按 Esc 清空。</p>
          <div class="result-line">
            <span>结果</span>
            <output id="result" aria-live="polite">—</output>
          </div>
          <p id="message" class="message" aria-live="assertive"></p>
        </div>

        <div class="keypad" aria-label="计算器按键">
          <button class="key key-utility" data-action="clear">AC</button>
          <button class="key key-utility" data-action="backspace" aria-label="删除最后一个字符">⌫</button>
          <button class="key key-operator" data-value="(">(</button>
          <button class="key key-operator" data-value=")">)</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key key-operator" data-value="/">÷</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key key-operator" data-value="*">×</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key key-operator" data-value="-">−</button>

          <button class="key key-zero" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key key-operator" data-value="+">+</button>
          <button class="key key-equals" data-action="calculate">=</button>
        </div>
      </section>

      <aside class="history-panel" aria-labelledby="history-title">
        <div class="history-heading">
          <div>
            <p class="eyebrow">DATABASE HISTORY</p>
            <h2 id="history-title">计算历史</h2>
          </div>
          <button id="clear-history" class="text-button" type="button">清空全部</button>
        </div>
        <p class="history-note">记录来自后端 SQLite 数据库，而不是浏览器缓存。</p>
        <div id="history-list" class="history-list" aria-live="polite">
          <p class="empty-state">正在读取历史记录…</p>
        </div>
      </aside>
    </main>

    <template id="history-item-template">
      <article class="history-item">
        <div class="history-main">
          <p class="history-expression"></p>
          <p class="history-result"></p>
          <time class="history-time"></time>
        </div>
        <button class="delete-button" type="button" aria-label="删除这条历史记录">删除</button>
      </article>
    </template>

    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
